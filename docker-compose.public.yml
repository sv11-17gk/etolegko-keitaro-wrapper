name: etolegko-keitaro

services:
  mock-keitaro:
    build: .
    command: uvicorn mock_keitaro.main:app --host 0.0.0.0 --port 8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  wrapper:
    build: .
    restart: unless-stopped
    environment:
      KT_BASE_URL: http://mock-keitaro:8081
      KT_API_KEY: mock-key
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:////data/wrapper.db
    ports:
      - "127.0.0.1:18081:8000"
    depends_on:
      mock-keitaro:
        condition: service_healthy
    volumes:
      - wrapper-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  wrapper-data:
