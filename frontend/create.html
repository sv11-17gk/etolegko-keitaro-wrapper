<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro Wrapper — новая кампания</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Keitaro <b>Wrapper</b></a>
  <nav class="topnav" aria-label="Навигация">
    <a href="/">Campaigns</a>
    <a class="active" href="/create.html" aria-current="page">New campaign</a>
    <a href="https://github.com/sv11-17gk/etolegko-keitaro-wrapper" target="_blank" rel="noopener">GitHub / README ↗</a>
  </nav>
</header>

<main class="page">
  <section class="card form-card">
    <h1>New campaign</h1>
    <p class="muted">Flow 1: указанные страны → Google. Flow 2: остальные посетители → оффер.
       Домен, группа и источник выбираются автоматически; их можно изменить ниже.</p>

    <form id="createForm">
      <label class="field">
        <span>Name</span>
        <input class="input" name="name" required placeholder="test_karin_campaign1">
      </label>
      <label class="field">
        <span>Geo</span>
        <input class="input" name="geos" required placeholder="MX, AU, RO">
        <small class="muted">Коды стран через запятую, например MX, AU.</small>
      </label>
      <label class="field">
        <span>Offer</span>
        <div class="offer-box">
          <input class="input" id="offerInput" required
                 placeholder="поиск по офферам: ID или название" autocomplete="off">
          <div id="offerSuggest" class="suggest hidden"></div>
        </div>
        <input type="hidden" name="offer_id" id="offerIdInput" required>
      </label>

      <details class="advanced">
        <summary>Домен, группа и источник</summary>
        <label class="field"><span>Домен</span>
          <select id="domainSelect" class="select"></select></label>
        <label class="field"><span>Группа</span>
          <select id="groupSelect" class="select"></select></label>
        <label class="field"><span>Источник</span>
          <select id="sourceSelect" class="select"></select></label>
      </details>

      <button type="submit" class="btn primary wide">CREATE</button>
    </form>

    <div id="result" class="result hidden"></div>
  </section>
</main>

<div id="toast" class="toast hidden" role="status"></div>
<script src="/js/create.js"></script>
</body>
</html>
