<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Keitaro Wrapper — редактор кампаний</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Keitaro <b>Wrapper</b></a>
  <nav class="topnav" aria-label="Навигация">
    <a class="active" href="/" aria-current="page">Campaigns</a>
    <a href="/create.html">New campaign</a>
    <a href="https://github.com/sv11-17gk/etolegko-keitaro-wrapper" target="_blank" rel="noopener">GitHub / README ↗</a>
  </nav>
</header>
<main class="workspace">
  <div class="campaign-context">
    <div class="breadcrumb"><span>Campaigns</span><span aria-hidden="true">/</span><strong id="campaignName">Кампании</strong><span aria-hidden="true">/</span><span>Keitaro Streams</span></div>
    <select id="campaignSelect" class="select" aria-label="Кампания"></select>
  </div>
  <p id="demoNote" class="demo-note hidden">Демо на тестовых данных. Кампании и изменения общие для всех посетителей.</p>
  <div class="toolbar">
    <button id="fetchBtn" class="btn">FETCH STREAMS FROM KT</button>
    <a id="viewInKt" class="btn hidden" target="_blank" rel="noopener">VIEW IN KT ↗</a>
    <a class="btn new-campaign" href="/create.html">NEW CAMPAIGN</a>
  </div>
  <div id="streams" class="streams" aria-live="polite">
    <p class="empty">Загружаем кампании и потоки…</p>
  </div>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="offersTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="offersTitle">All offers</h2>
      <button id="modalClose" class="btn small">CLOSE</button>
    </div>
    <input id="modalSearch" class="input" aria-label="Поиск по всем офферам" placeholder="ID или название оффера" autocomplete="off">
    <div id="modalList" class="modal-list"></div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/js/app.js"></script>
</body>
</html>
